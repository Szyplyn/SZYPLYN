<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Szypłyn - płyn do spryskiwaczy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }
        header {
            background-color: #0077cc;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .product {
            display: flex;
            gap: 30px;
            align-items: center;
        }
        .product img {
            width: 250px;
            border-radius: 10px;
        }
        .info {
            flex: 1;
        }
        .price {
            font-size: 28px;
            color: #28a745;
            margin: 15px 0;
        }
        button {
            background-color: #0077cc;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #005fa3;
        }
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            color: #666;
        }
    </style>
</head>
<body>

<header>
    <h1>Szypłyn</h1>
    <p>Płyn do spryskiwaczy 5L</p>
</header>

<div class="container">
    <div class="product">
        <img src="https://via.placeholder.com/250" alt="Szypłyn 5L">
        
        <div class="info">
            <h2>Szypłyn 5L</h2>
            <p>Wysokiej jakości płyn do spryskiwaczy. Skutecznie usuwa zabrudzenia, zapewnia dobrą widoczność i bezpieczeństwo jazdy.</p>
            
            <div class="price">18 zł</div>
            
            <button>Kup teraz</button>
        </div>
    </div>
</div>

<footer>
    <p>&copy; 2026 Szypłyn - Wszystkie prawa zastrzeżone</p>
</footer>

</body>
</html>
