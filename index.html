<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Szypłyn – Reklama</title>

<style>
body{
 margin:0;
 font-family:Arial;
 color:white;
 background:black;
 overflow-x:hidden;
}

section{
 position:relative;
 height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 text-align:center;
}

video{
 position:absolute;
 width:100%;
 height:100%;
 object-fit:cover;
 top:0;
 left:0;
}

.overlay{
 position:absolute;
 inset:0;
 background:rgba(0,0,0,0.5);
}

.card{
 position:relative;
 background:rgba(0,0,0,0.6);
 padding:40px;
 border-radius:20px;
 backdrop-filter:blur(10px);
}

.table{
 background:rgba(0,0,0,0.85);
 padding:30px;
 border-radius:15px;
}

.row{
 display:flex;
 justify-content:space-between;
 padding:10px;
 border-bottom:1px solid rgba(255,255,255,0.2);
}

.good{color:#22c55e}
.bad{color:#ef4444}

button{
 margin-top:20px;
 padding:15px;
 width:100%;
 background:#22c55e;
 border:none;
 border-radius:10px;
 cursor:pointer;
}
</style>
</head>

<body>

<!-- DESZCZ -->
<section>
<video autoplay muted loop playsinline>
<source src="https://cdn.coverr.co/videos/coverr-rain-on-window-1573/1080p.mp4">
</video>
<div class="overlay"></div>

<div class="card">
<h1>Jedziesz w deszczu...</h1>
<p>Nic nie widać</p>
</div>
</section>

<!-- JAZDA -->
<section>
<video autoplay muted loop playsinline>
<source src="https://cdn.coverr.co/videos/coverr-driving-in-the-rain-5408/1080p.mp4">
</video>
<div class="overlay"></div>

<div class="card">
<h2>Smugi na szybie</h2>
</div>
</section>

<!-- ROZWIĄZANIE -->
<section>
<video autoplay muted loop playsinline>
<source src="https://cdn.coverr.co/videos/coverr-clean-car-windshield-5125/1080p.mp4">
</video>
<div class="overlay"></div>

<div class="card">
<h2>Szypłyn 5L</h2>
<p>Zero smug</p>
<h1 style="color:#22c55e;">18 zł</h1>
</div>
</section>

<!-- PORÓWNANIE -->
<section>
<div class="table">
<h2>Porównanie</h2>

<div class="row">
<span>Inne płyny</span>
<span class="bad">Smugi ❌</span>
</div>

<div class="row">
<span>Szypłyn</span>
<span class="good">Brak smug ✅</span>
</div>

<div class="row">
<span>Widoczność</span>
<span class="good">Perfekcyjna ✅</span>
</div>

<button>Kup teraz</button>
</div>
</section>

</body>
</html>
