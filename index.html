<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Szypłyn – Reklama Video</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',sans-serif;color:white;background:black;overflow-x:hidden}

section{
 position:relative;
 height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 text-align:center;
 overflow:hidden;
}

video{
 position:absolute;
 top:0;left:0;
 width:100%;height:100%;
 object-fit:cover;
 z-index:0;
}

.overlay{
 position:absolute;
 inset:0;
 background:rgba(0,0,0,0.35);
 z-index:1;
}

.card{
 position:relative;
 z-index:2;
 background:rgba(0,0,0,0.6);
 padding:40px;
 border-radius:20px;
 backdrop-filter:blur(10px);
 max-width:400px;
}

.price{font-size:32px;color:#4ade80;margin:10px 0}

.table{
 background:rgba(0,0,0,0.85);
 padding:20px;
 border-radius:15px;
}

.row{
 display:flex;
 justify-content:space-between;
 padding:10px 0;
 border-bottom:1px solid rgba(255,255,255,0.2);
}

.good{color:#4ade80}
.bad{color:#ef4444}

button{
 margin-top:15px;
 padding:15px;
 width:100%;
 background:#22c55e;
 border:none;
 border-radius:10px;
 cursor:pointer;
 font-size:16px;
}

</style>
</head>
<body>

<!-- 🎬 SEKCJA 1 – DESZCZ -->
<section>
<video autoplay muted loop playsinline>
 <source src="https://cdn.coverr.co/videos/coverr-rain-on-window-1573/1080p.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="card">
<h1>Jedziesz w deszczu...</h1>
<p>Nic nie widać</p>
</div>
</section>

<!-- 🎬 SEKCJA 2 – JAZDA -->
<section>
<video autoplay muted loop playsinline>
 <source src="https://cdn.coverr.co/videos/coverr-driving-in-the-rain-5408/1080p.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="card">
<h2>Problem</h2>
<p>Smugi na szybie</p>
</div>
</section>

<!-- 🎬 SEKCJA 3 – CZYSTA SZYBA -->
<section>
<video autoplay muted loop playsinline>
 <source src="https://cdn.coverr.co/videos/coverr-clean-car-windshield-5125/1080p.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="card">
<h2>Szypłyn 5L</h2>
<p>Zero smug – idealna widoczność</p>
<div class="price">18 zł</div>
</div>
</section>

<!-- 📊 PORÓWNANIE -->
<section>
<div class="table">
<h2>Porównanie</h2>
<div class="row"><span>Inne płyny</span><span class="bad">Smugi ❌</span></div>
<div class="row"><span>Szypłyn</span><span class="good">Brak smug ✅</span></div>
<div class="row"><span>Widoczność</span><span class="good">Perfekcyjna ✅</span></div>
<button>Kup teraz – 18 zł</button>
</div>
</section>

<script>
// wymuszenie autoplay (Safari fix)
document.querySelectorAll("video").forEach(v=>{
 v.muted=true;
 v.play().catch(()=>{
  document.body.addEventListener("click",()=>v.play(),{once:true});
 });
});
</script>

</body>
</html>
