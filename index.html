<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Szypłyn</title>

<style>
body{
 margin:0;
 font-family:Arial;
 background:black;
 color:white;
 overflow-x:hidden;
}

/* 🌧 DESZCZ */
.rain{
 position:fixed;
 width:100%;
 height:100%;
 background-image:linear-gradient(transparent, rgba(255,255,255,0.2));
 animation:rain 0.3s linear infinite;
 opacity:0.2;
 z-index:-1;
}

@keyframes rain{
 from{background-position:0 -100px}
 to{background-position:0 100px}
}

/* 🌌 TŁO */
.bg{
 position:fixed;
 width:100%;
 height:100%;
 background:radial-gradient(circle at center, #111, #000);
 z-index:-2;
}

/* 🎬 SEKCJE */
.section{
 height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 text-align:center;
}

/* 🧊 KARTA */
.card{
 background:rgba(0,0,0,0.6);
 padding:40px;
 border-radius:20px;
 backdrop-filter:blur(15px);
 transform:translateY(50px);
 opacity:0;
 transition:1s;
}

.card.show{
 transform:translateY(0);
 opacity:1;
}

/* 💰 */
.price{
 font-size:40px;
 color:#22c55e;
}

/* 🟡 AUTO (fake efekt) */
.car{
 width:200px;
 height:100px;
 background:linear-gradient(to right, yellow, orange);
 border-radius:20px;
 margin:20px auto;
 box-shadow:0 0 40px rgba(255,255,0,0.5);
 animation:drive 3s infinite linear;
}

@keyframes drive{
 from{transform:translateX(-100px)}
 to{transform:translateX(100px)}
}

button{
 padding:15px 25px;
 background:#22c55e;
 border:none;
 border-radius:10px;
 margin-top:15px;
 cursor:pointer;
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="rain"></div>

<!-- SCENA 1 -->
<div class="section">
<div class="card">Jedziesz w deszczu...<br>Nic nie widać</div>
</div>

<!-- SCENA 2 -->
<div class="section">
<div class="card">
<div class="car"></div>
Smugi na szybie...
</div>
</div>

<!-- SCENA 3 -->
<div class="section">
<div class="card">
Szypłyn 5L<br>
<span class="price">18 zł</span>
</div>
</div>

<!-- SCENA 4 -->
<div class="section">
<div class="card">
Brak smug ✅<br>
<button>Kup teraz</button>
</div>
</div>

<script>
const cards=document.querySelectorAll(".card");

const observer=new IntersectionObserver(entries=>{
 entries.forEach(e=>{
  if(e.isIntersecting){
   e.target.classList.add("show");
  }
 });
});

cards.forEach(c=>observer.observe(c));
</script>

</body>
</html>
