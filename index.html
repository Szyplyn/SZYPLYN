<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Szypłyn 5L</title>

<script src="https://js.stripe.com/v3/"></script>

<style>
body{
 font-family: Arial;
 background:#111;
 color:white;
 text-align:center;
 padding:50px;
}
button{
 padding:15px 30px;
 font-size:18px;
 background:#4ade80;
 border:none;
 border-radius:10px;
 cursor:pointer;
}
</style>
</head>

<body>

<h1>Szypłyn 5L</h1>
<p>Cena: 18 zł</p>

<select id="qty">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
</select>

<br><br>

<button id="buy">Kup teraz</button>

<script>
const stripe = Stripe("pk_test_TUTAJ_WKLEJ_SWÓJ_KLUCZ");

document.getElementById("buy").onclick = async () => {
 const qty = document.getElementById("qty").value;

 const res = await fetch("/api/create-checkout-session", {
  method: "POST",
  headers: {"Content-Type": "application/json"},
  body: JSON.stringify({ qty })
 });

 const data = await res.json();

 stripe.redirectToCheckout({
  sessionId: data.id
 });
};
</script>

</body>
</html>
