<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Szypłyn</title>

<style>
body{
 margin:0;
 font-family:Arial;
 background:black;
 color:white;
 overflow-x:hidden;
}

/* VIDEO TŁO */
video{
 position:fixed;
 width:100%;
 height:100%;
 object-fit:cover;
 top:0;
 left:0;
 z-index:-2;
}

/* CIEMNA WARSTWA */
.overlay{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,0.5);
 z-index:-1;
}

/* SEKCJE */
.section{
 height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 text-align:center;
}

/* TEKST – DUŻY, KINOWY */
.text{
 font-size:48px;
 font-weight:600;
 max-width:800px;
 line-height:1.4;
 opacity:0;
 transform:translateY(40px);
 transition:1s;
}

/* POJAWIANIE */
.show{
 opacity:1;
 transform:translateY(0);
}

.price{
 color:#22c55e;
 font-size:60px;
 margin-top:20px;
}

button{
 margin-top:30px;
 padding:18px 40px;
 font-size:18px;
 background:#22c55e;
 border:none;
 border-radius:12px;
 cursor:pointer;
}
</style>
</head>

<body>

<!-- 🔥 PRAWDZIWE VIDEO -->
<video autoplay muted loop playsinline>
<source src="/video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- SCENA 1 -->
<div class="section">
<div class="text">Jedziesz w deszczu…<br>Nic nie widać</div>
</div>

<!-- SCENA 2 -->
<div class="section">
<div class="text">Smugi na szybie…</div>
</div>

<!-- SCENA 3 -->
<div class="section">
<div class="text">
Szypłyn 5L<br>
<div class="price">18 zł</div>
</div>
</div>

<!-- SCENA 4 -->
<div class="section">
<div class="text">
Brak smug. Pełna widoczność.<br>
<button>Kup teraz</button>
</div>
</div>

<script>
const texts=document.querySelectorAll(".text");

const observer=new IntersectionObserver(entries=>{
 entries.forEach(e=>{
  if(e.isIntersecting){
   e.target.classList.add("show");
  }
 });
},{threshold:0.5});

texts.forEach(t=>observer.observe(t));
</script>

</body>
</html>
